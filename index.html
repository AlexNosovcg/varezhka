<script>
(async () => {
'use strict';
/* Чтобы поставить настоящий макет: положите рядом PNG лицевой стороны варежки
   с прозрачным фоном под именем mitten.png. Из этой же картинки делается метка targets.mind. */
const ART_URL = 'mitten.png';

const LW = 600, LH = 800;            // логическое поле макета
const PAD = 1.3;                     // холст шире макета — место для свечения и тени
const CW = LW * PAD, CH = LH * PAD, OX = (CW - LW) / 2, OY = (CH - LH) / 2;
const T = 1.5, TW = LW * T, TH = LH * T;   // разрешение текстур
const FC0 = [338, 395], FC1 = [338, 618], FS1 = 0.3, FR = 150, FSPAN = 360;

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = v => Math.max(0, Math.min(1, v));
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeO = t => 1 - Math.pow(1 - t, 3);
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

try { await Promise.all([document.fonts.load('800 40px Vz', 'Традиции'), document.fonts.load('italic 800 40px Vz', 'С Новым')]); } catch (e) {}

/* ---------- Макет (кадр 1) ---------- */
function mittenPath(g) {
  g.beginPath();
  g.moveTo(190, 772); g.lineTo(470, 772); g.quadraticCurveTo(488, 772, 489, 752);
  g.bezierCurveTo(505, 640, 522, 480, 516, 330); g.bezierCurveTo(510, 140, 425, 38, 322, 38);
  g.bezierCurveTo(212, 38, 158, 125, 160, 255); g.lineTo(163, 372);
  g.bezierCurveTo(132, 322, 84, 296, 56, 326); g.bezierCurveTo(24, 362, 52, 450, 104, 522);
  g.bezierCurveTo(138, 566, 166, 612, 172, 660); g.lineTo(171, 752); g.quadraticCurveTo(172, 772, 190, 772);
  g.closePath();
}
function star4(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .3 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function drawPlaceholder() {
  const c = mk(TW, TH), g = c.getContext('2d');
  g.scale(T, T); mittenPath(g); g.save(); g.clip();
  const bg = g.createLinearGradient(100, 0, 500, 800);
  bg.addColorStop(0, '#2a3df0'); bg.addColorStop(.55, '#1f2bd8'); bg.addColorStop(1, '#1820b8');
  g.fillStyle = bg; g.fillRect(0, 0, LW, LH);
  const silver = (y0, y1) => { const s = g.createLinearGradient(0, y0, 0, y1);
    s.addColorStop(0, '#ffffff'); s.addColorStop(.42, '#cfd5e2'); s.addColorStop(.5, '#f4f6fa'); s.addColorStop(.58, '#b9c0d0'); s.addColorStop(1, '#e6e9f1'); return s; };
  g.fillStyle = g.strokeStyle = '#e9ecf4'; g.lineWidth = 2.6; g.lineCap = 'round';
  [[250,95,20],[400,112,26],[300,172,18],[470,236,22],[215,208,24],[455,600,20],[232,640,26],[352,668,18],[96,408,20],[405,690,16]]
    .forEach(([x, y, l]) => { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + l); g.stroke(); });
  [[205,300,10],[472,332,11],[424,560,9],[296,604,10],[140,474,9],[352,128,8]].forEach(([x, y, r]) => star4(g, x, y, r));
  g.save(); g.translate(338, 388); g.rotate(-0.075);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.shadowColor = 'rgba(4,8,90,.45)'; g.shadowOffsetY = 4; g.shadowBlur = 6;
  g.fillStyle = silver(-95, -25); g.font = 'italic 800 68px Vz,Georgia,serif'; g.fillText('С Новым', -4, -22);
  g.fillStyle = silver(-15, 62);  g.font = 'italic 800 80px Vz,Georgia,serif'; g.fillText('годом', 6, 52);
  g.fillStyle = silver(72, 112);
  g.beginPath(); g.moveTo(-158, 80); g.quadraticCurveTo(0, 104, 158, 74); g.lineTo(146, 88); g.lineTo(160, 100);
  g.quadraticCurveTo(0, 130, -160, 106); g.lineTo(-146, 93); g.closePath(); g.fill();
  g.restore();
  g.fillStyle = '#d5dae8'; g.textAlign = 'center'; g.font = '800 25px Vz,Arial,sans-serif';
  try { g.letterSpacing = '1px'; } catch (e) {}
  g.fillText('RIS GROUP', 332, 738);
  g.restore();
  return c;
}
const ART = { src: null, w: LW };   // картинка-метка и её ширина в логических единицах
async function loadArt() {
  if (!ART_URL || location.protocol === 'file:') return drawPlaceholder();
  try {
    const img = new Image(); img.src = ART_URL; await img.decode();
    const c = mk(TW, TH), g = c.getContext('2d'), m = 0.035;
    const k = Math.min(TW * (1 - 2 * m) / img.width, TH * (1 - 2 * m) / img.height);
    g.drawImage(img, (TW - img.width * k) / 2, (TH - img.height * k) / 2, img.width * k, img.height * k);
    g.getImageData(0, 0, 1, 1);
    ART.src = img; ART.w = img.width * k / T;
    return c;
  } catch (e) { return drawPlaceholder(); }
}
const baseCanvas = await loadArt();
if (!ART.src) ART.src = baseCanvas;

/* ---------- Мягкая маска силуэта (на весь холст): фронт инея, тень, ореол ---------- */
const MW = 195, MH = 260, MK = MW / CW;
const M = (() => {
  const c = mk(MW, MH), g = c.getContext('2d');
  g.drawImage(baseCanvas, OX * MK, OY * MK, LW * MK, LH * MK);
  const img = g.getImageData(0, 0, MW, MH), d = img.data;
  let a = new Float32Array(MW * MH);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] / 255;
  const pass = (src, r, dx, dy) => { const o = new Float32Array(src.length), n = 2 * r + 1;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { let s = 0;
      for (let k = -r; k <= r; k++) { const xx = x + k * dx, yy = y + k * dy; if (xx >= 0 && xx < MW && yy >= 0 && yy < MH) s += src[yy * MW + xx]; }
      o[y * MW + x] = s / n; } return o; };
  for (let p = 0; p < 3; p++) a = pass(pass(a, 8, 1, 0), 8, 0, 1);
  for (let i = 0; i < a.length; i++) { const v = Math.round(clamp(a[i]) * 255); d[i*4] = d[i*4+1] = d[i*4+2] = v; d[i*4+3] = 255; }
  g.putImageData(img, 0, 0);
  const at = (x, y) => { const ix = Math.round((x + OX) * MK), iy = Math.round((y + OY) * MK);
    return ix < 0 || iy < 0 || ix >= MW || iy >= MH ? 0 : a[iy * MW + ix]; };
  return { canvas: c, a, at };
})();

/* ---------- Иней: ледяные «папоротники», растущие от края. Яркость + время появления ---------- */
function genFrost() {
  const rnd = rng(11), NT = 48, SPEED = 0.0027, buckets = [];
  const seg = (x0, y0, x1, y1, t, d) => { const k = d * NT + Math.min(NT - 1, Math.max(0, Math.floor(t * NT)));
    const p = buckets[k] || (buckets[k] = new Path2D()); p.moveTo(x0 * T, y0 * T); p.lineTo(x1 * T, y1 * T); };
  function fern(x, y, ang, len, t, d) {
    const STEP = d === 0 ? 5 : 4, n = Math.floor(len / STEP), curve = (rnd() - .5) * (d === 0 ? .09 : .03);
    for (let i = 0; i < n; i++) {
      const nx = x + Math.cos(ang) * STEP, ny = y + Math.sin(ang) * STEP;
      if (M.at(nx, ny) < .34) break;
      seg(x, y, nx, ny, t, d); x = nx; y = ny; ang += curve + (rnd() - .5) * .06; t += STEP * SPEED;
      if (d < 2 && i > 0 && i % 2 === 0) {
        const bl = Math.min((n - i) * STEP * .6, d === 0 ? 64 : 13) * (.5 + rnd() * .5);
        if (bl > 5) { fern(x, y, ang + 1.05, bl, t, d + 1); fern(x, y, ang - 1.05, bl, t, d + 1); }
      }
    }
  }
  // затравки по контуру
  const cand = [];
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) { const v = M.a[y * MW + x];
    if (v > .43 && v < .5) cand.push([x, y, rnd()]); }
  cand.sort((p, q) => p[2] - q[2]);
  const seeds = [];
  for (const [x, y] of cand) {
    const lx = x / MK - OX, ly = y / MK - OY;
    if (seeds.some(s => Math.hypot(s[0] - lx, s[1] - ly) < 27)) continue;
    const gx = M.a[y * MW + x + 1] - M.a[y * MW + x - 1], gy = M.a[(y + 1) * MW + x] - M.a[(y - 1) * MW + x];
    seeds.push([lx, ly, Math.atan2(gy, gx)]);
  }
  for (const [x, y, a] of seeds) fern(x, y, a + (rnd() - .5) * .9, 90 + rnd() * rnd() * 240, rnd() * .1, 0);
  // ледяные «цветы» в середине и мелкие иглы
  for (let i = 0, k = 0; i < 400 && k < 7; i++) { const x = 60 + rnd() * 480, y = 60 + rnd() * 700;

  const t = FREEZE != null ? FREEZE : running ? (now - start) / 1000 : 0, time = now / 1000;

  if (now - tilt.last > 2500) { tilt.tx = Math.sin(time * .55) * .32; tilt.ty = Math.cos(time * .4) * .22; }
  tilt.x += (tilt.tx - tilt.x) * Math.min(1, dt * 4); tilt.y += (tilt.ty - tilt.y) * Math.min(1, dt * 4);
  const fade = easeO(ph(TL.fade, t));
  if (!AR) stage.style.transform = `translate(-50%,-50%) rotateY(${(tilt.x * 9).toFixed(2)}deg) rotateX(${(-tilt.y * 7).toFixed(2)}deg) scale(${(.93 + .07 * fade).toFixed(4)})`;
  if (!AR) drawSnow(time, dt);

  const draw = ph(TL.draw, t), g = easeIO(ph(TL.glow, t)), mv = easeIO(ph(TL.move, t)), ring = ph(TL.ring, t);
  const since = t - TL.glow[0];
  const glow = g * (.8 + .2 * Math.sin(t * 3.1)) * (1 - mv * .45);
  const flash = since > 0 ? Math.exp(-since * 2.6) : 0;
  const rays = since > 0 ? (Math.min(1, since * 5) * (.3 + .7 * Math.exp(-since * 1.1))) * (1 - mv * .55) : 0;
  const fcx = FC0[0] + (FC1[0] - FC0[0]) * mv, fcy = FC0[1] + (FC1[1] - FC0[1]) * mv, fs = 1 + (FS1 - 1) * mv;

  let finger = null;
  if (draw > 0 && draw < 1) { const tip = drawFlake(draw); flakeDirty = true;
    if (tip) { finger = [FC0[0] + tip[0], FC0[1] + tip[1]]; if (Math.random() < .6) burst(finger[0], finger[1], 1, .7, .7); } }
  else if (draw >= 1 && !flakeDone) { drawFlake(1); flakeDone = flakeDirty = true; }
  else if (draw <= 0 && flakeDirty) drawFlake(0);
  if (flakeDirty) { bind(2, flakeTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, flakeCanvas); flakeDirty = false; }

  if (since >= 0 && !burstDone) { burstDone = true; burst(FC0[0], FC0[1], 46, 4.2, 1.2);
    for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; burst(FC0[0] + Math.cos(a) * FR, FC0[1] + Math.sin(a) * FR, 12, 2.4); } }
  if (t > TL.msg[0] && t < TL.end + 60 && Math.random() < .22) burst(185 + Math.random() * 310, 200 + Math.random() * 460, 1, .25, .6);
  drawFx(dt, t, finger);

  gl.useProgram(main.p); const u = main.u;
  gl.uniform1f(u.uTime, time % 1000); gl.uniform1f(u.uFrost, ph(TL.frost, t)); gl.uniform1f(u.uHaze, easeIO(ph(TL.haze, t)));
  gl.uniform1f(u.uDraw, draw > 0 ? 1 : 0); gl.uniform1f(u.uGlow, glow); gl.uniform1f(u.uFlash, flash);
  gl.uniform1f(u.uRing, ring >= 1 ? 0 : easeO(ring)); gl.uniform1f(u.uRays, rays); gl.uniform1f(u.uMsg, ph(TL.msg, t));
  gl.uniform1f(u.uSweep, -.4 + 2.3 * easeIO(ph(TL.sweep, t))); gl.uniform1f(u.uFS, fs); gl.uniform1f(u.uFade, fade);
  gl.uniform2f(u.uTilt, tilt.x, tilt.y); gl.uniform2f(u.uFC, fcx, fcy);
  bind(6, null); bind(7, null);
  gl.uniform1f(u.uMode, 1); quad(fbB.f, fbB.w, fbB.h);
  gl.useProgram(blur.p);
  blurPass(fbB, fbC, 1.3 / 240, 0); blurPass(fbC, fbB, 0, 1.3 / 320);
  blurPass(fbB, fbE, 1.4 / 60, 0); blurPass(fbE, fbF, 0, 1.4 / 80);
  gl.useProgram(main.p); bind(6, fbB.t); bind(7, fbF.t);
  gl.uniform1f(u.uMode, 0); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, glc.width, glc.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (t > TL.end && !endShown) { endShown = true; btn.classList.add('show'); }
}
requestAnimationFrame(frame);
if (FREEZE != null) { running = true; document.getElementById('intro').classList.add('hide'); }
window.VZ = { CW, art: ART, glc, fxc, restart, shift: ms => { start += ms; },
  setAR: on => { AR = on; document.body.classList.toggle('ar', on); onResize(); }, get running() { return running; } };
window.dispatchEvent(new Event('vz-ready'));
})();
</script>
<script type="module">
/* ---------- AR: распознавание варежки (MindAR) и наложение анимации ---------- */
const $ = id => document.getElementById(id);
const hint = (text) => { $('hint').textContent = text || ''; $('hint').classList.toggle('show', !!text); };
if (!window.VZ) await new Promise(r => addEventListener('vz-ready', r, { once: true }));
const VZ = window.VZ;
const TARGET_IMG = 'qr.png';     // картинка-метка: QR-код
const TARGET_MIND = 'qr.mind';   // собранная из неё метка (компилятор MindAR)
const MITTEN_SCALE = 2.4;        // ширина варежки относительно ширины QR-кода
const MITTEN_SHIFT = [0, 0];     // сдвиг варежки от центра QR, в ширинах QR (x вправо, y вверх)

async function targetUrl() {
  try {   // готовая метка, собранная заранее компилятором MindAR
    const r = await fetch(TARGET_MIND);
    if (r.ok && !(r.headers.get('content-type') || '').includes('text/html')) return URL.createObjectURL(await r.blob());
  } catch (e) {}
  // запасной путь: собрать метку из картинки прямо в браузере (медленнее, несколько секунд)
  hint('Готовим метку…');
  await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
  const compiler = new window.MINDAR.IMAGE.Compiler();
  const img = new Image(); img.src = TARGET_IMG; await img.decode();
  await compiler.compileImageTargets([img], p => hint(`Готовим метку… ${Math.round(p)}%`));
  return URL.createObjectURL(new Blob([await compiler.exportData()]));
}

async function startAR() {
  hint('Загрузка…');
  const THREE = await import('three');
  const { MindARThree } = await import('mindar-image-three');
  const src = await targetUrl();
  VZ.setAR(true);
  const mindar = new MindARThree({ container: $('ar'), imageTargetSrc: src, uiLoading: 'no', uiScanning: 'no', uiError: 'no', missTolerance: 10 });
  const { renderer, scene, camera } = mindar;
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // цвета холста передаём как есть
  const anchor = mindar.addAnchor(0);
  const W = VZ.CW / VZ.art.w * MITTEN_SCALE, H = W * 4 / 3;   // ширина метки (QR) = 1
  const layer = (canvas, order) => {
    const tex = new THREE.CanvasTexture(canvas);
    tex.premultiplyAlpha = true; tex.colorSpace = THREE.NoColorSpace; tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false, toneMapped: false,
      blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat); mesh.renderOrder = order; mesh.position.set(MITTEN_SHIFT[0], MITTEN_SHIFT[1], 0); anchor.group.add(mesh);
    return tex;
  };
  const layers = [layer(VZ.glc, 1), layer(VZ.fxc, 2)];
  let lostAt = 0;
  anchor.onTargetFound = () => { hint('');
    if (!VZ.running) VZ.restart(); else if (lostAt) VZ.shift(performance.now() - lostAt); lostAt = 0; };
  anchor.onTargetLost = () => { lostAt = performance.now(); hint('Наведите камеру на QR-код'); };
  await mindar.start();
  hint('Наведите камеру на QR-код');
  renderer.setAnimationLoop(() => { if (anchor.group.visible) layers.forEach(t => t.needsUpdate = true); renderer.render(scene, camera); });
}
function startPlain(note) {
  VZ.setAR(false); VZ.restart(); hint(note || '');
  if (note) setTimeout(() => hint(''), 3500);
}
$('go').addEventListener('click', async () => {
  $('intro').classList.add('hide');
  try { await startAR(); }
  catch (e) { console.warn('AR недоступен:', e); startPlain('Камера недоступна — показываем анимацию'); }
});
$('noar').addEventListener('click', () => { $('intro').classList.add('hide'); startPlain(); });
</script>
